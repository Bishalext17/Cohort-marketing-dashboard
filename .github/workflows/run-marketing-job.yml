name: Run Marketing Pipeline Job On Demand

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days (default: 1)'
        required: false
        default: '1'
      date_from:
        description: 'From Date (YYYY-MM-DD, e.g. 2026-09-01)'
        required: false
        type: string
        default: ''
      date_to:
        description: 'To Date (YYYY-MM-DD, e.g. 2026-09-14)'
        required: false
        type: string
        default: ''
      mode:
        description: 'Sync Mode'
        required: true
        type: choice
        options:
          - incremental
          - full
        default: 'incremental'
      dry_run:
        description: 'Dry Run (Simulate without writing to DB)'
        required: false
        type: boolean
        default: false

env:
  PROJECT_ID: bambinos-411405
  PROJECT_NUMBER: "1045498615373"
  DEPLOY_SA: bambino-cicd-sa@bambinos-411405.iam.gserviceaccount.com
  REGION: asia-south1
  JOB_NAME: marketing-daily-sync

jobs:
  run-marketing-job:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute Cloud Run Job
        run: |
          ARGS_LIST=("backend/scripts/run_daily_pipeline.py" "--mode" "${{ github.event.inputs.mode }}")
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS_LIST+=("--dry-run")
          fi
          
          if [ -n "${{ github.event.inputs.date_from }}" ] && [ -n "${{ github.event.inputs.date_to }}" ]; then
            ARGS_LIST+=("--date-from" "${{ github.event.inputs.date_from }}" "--date-to" "${{ github.event.inputs.date_to }}")
          else
            ARGS_LIST+=("--days" "${{ github.event.inputs.days }}")
          fi
          
          JOINED_ARGS=$(IFS=,; echo "${ARGS_LIST[*]}")
          
          echo "🚀 Executing Cloud Run Job: ${{ env.JOB_NAME }} with arguments: $JOINED_ARGS"
          gcloud run jobs execute "${{ env.JOB_NAME }}" --region "${{ env.REGION }}" --args="$JOINED_ARGS" --wait
